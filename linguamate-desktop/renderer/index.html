<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self' http://localhost:8787 ws://localhost:8787; font-src 'self'; object-src 'none'; base-uri 'none';"
    />
    <title>LinguaMate</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <header class="bar" id="drag-handle">
        <span class="title">LinguaMate</span>
        <span class="status" id="status">等待后端就绪…</span>
        <button class="icon" id="hide" type="button" title="隐藏窗口" aria-label="隐藏窗口">×</button>
      </header>
      <section class="row" aria-label="中文净化稿">
        <span class="row-label">中文</span>
        <textarea
          id="zh"
          class="row-content editor"
          lang="zh-CN"
          spellcheck="false"
          aria-label="中文，可直接输入后按 Ctrl+Enter 翻译"
          placeholder="（录音，或直接输入中文）"
        ></textarea>
        <button id="copy-zh" class="icon-btn" type="button" title="复制中文净化稿" aria-label="复制中文">
          <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true" focusable="false">
            <rect x="2.5" y="3.5" width="8" height="10" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.2" />
            <rect x="5" y="1.5" width="8" height="10" rx="1.2" fill="#2a2f3f" stroke="currentColor" stroke-width="1.2" />
          </svg>
          <span>复制</span>
        </button>
        <button id="translate-zh" class="icon-btn" type="button" title="翻译中文（Ctrl+Enter）" aria-label="翻译中文">
          <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true" focusable="false">
            <path d="M2 8 H12.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
            <path d="M10 5 L12.8 8 L10 11" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span>翻译</span>
        </button>
      </section>
      <section class="row accent" aria-label="英文翻译">
        <span class="row-label">English</span>
        <textarea
          id="en"
          class="row-content editor"
          lang="en"
          spellcheck="false"
          aria-label="英文翻译，可直接编辑后复制或朗读"
          placeholder="English translation will appear here."
        ></textarea>
        <button id="copy-en" class="icon-btn" type="button" title="复制英文翻译" aria-label="复制英文">
          <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true" focusable="false">
            <rect x="2.5" y="3.5" width="8" height="10" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.2" />
            <rect x="5" y="1.5" width="8" height="10" rx="1.2" fill="#2a2f3f" stroke="currentColor" stroke-width="1.2" />
          </svg>
          <span>复制</span>
        </button>
        <button id="speak-en" class="icon-btn" type="button" title="朗读英文 / 停止朗读" aria-label="朗读或停止" disabled>
          <svg id="speak-icon-play" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true" focusable="false">
            <path d="M3.5 5.5 L6 5.5 L9 3 L9 13 L6 10.5 L3.5 10.5 Z" fill="currentColor" />
            <path d="M11 5.5 Q12.5 8 11 10.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
          </svg>
          <svg id="speak-icon-stop" viewBox="0 0 16 16" width="11" height="11" aria-hidden="true" focusable="false" style="display:none;">
            <rect x="4" y="4" width="8" height="8" rx="1" fill="currentColor" />
          </svg>
          <span id="speak-en-label">朗读</span>
        </button>
      </section>
      <footer class="footer">
        <button id="record-toggle" class="record" type="button" aria-label="开始或停止录音">
          <span class="dot" aria-hidden="true"></span>
          <span id="record-label">开始说话</span>
        </button>
      </footer>
      <audio id="speak-audio" hidden></audio>
    </main>
    <script src="renderer.js"></script>
  </body>
</html>
